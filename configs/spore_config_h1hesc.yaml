# SPORE config: Virtual Cell Challenge h1-hESC CRISPRi screen (~221k cells). Runs in-process on a workstation or one cluster node.
# Settings follow the July 2026 HPC1 VCCv3 run.
#   python spore_local.py --config configs/spore_config_h1hesc.yaml

paths:
  project_root: .
  raw_h5ad: data/VCC_h1hESC_raw.h5ad          # SET: the raw VCC training h5ad
  processed_dir: spore_out_h1hesc/processed   # FRESH dirs for every run
  splits_dir:    spore_out_h1hesc/splits
  figures_dir:   spore_out_h1hesc/figures
  log_dir:       spore_out_h1hesc/logs

dataset:
  name: VCC_h1hESC
  organism: human
  cell_type: h1-hESC
  perturbation_col: target_gene     # VCC uses target_gene, not gene
  control_label: non-targeting
  perturbation_type: CRISPRi
  gene_id_format: symbol            # var_names are already HGNC symbols

runtime:
  n_jobs: 8
  sparse_on_load: true
  memory_monitor: true
  large_dataset_mode: auto
  large_dataset_threshold: 500000   # 221k cells stays in-process
  checkpointing: true

phase0_ingestion: {chunk_size: 50000}
phase1_detection:
  enabled: true
  gene_id_harmonization: false
  modality_detection: false
  combinatorial_detection: false
  cell_line_detection: false

phase2_cell_triage:
  mt_method: explicit_list
  mt_threshold: 0.2
  mt_genes: [MT-ND1, MT-ND2, MT-ND3, MT-ND4, MT-ND4L, MT-ND5, MT-ND6, MT-CO1, MT-CO2, MT-CO3, MT-ATP6, MT-ATP8, MT-CYB]
  ribo_prefixes: [RPL, RPS]
  min_genes_per_cell: 200
  max_genes_per_cell: 10000
  min_counts_per_cell: 500
  max_counts_per_cell: 80000

phase3_ambient: {enabled: false}
phase4_doublets: {enabled: false}
phase5_escaper_filtering:
  efficiency_threshold: 0.5
  escaper_percentile: 10
  min_cells_per_perturbation: 50
  direction: auto

phase6_gene_triage:
  min_cells_expressing: 10
  pct_filter: 0.01
  mean_umi_threshold: 0.25
  rescue_perturbation_targets: true
  rescue_combinatorial_constituents: false

phase7_splits:
  mode: zero_shot
  random_seed: 42
  stratify_bins: 4
  test_n: 40
  val_n: 20

phase8_hvg:
  enabled: true
  n_top_genes: 5000
  method: seurat_v3
  rescue_perturbation_targets: true
  protected_gene_list: protected_genes/protected_genes_h1_hESC.json   # curated tiers; held-out targets are added automatically

phase9_normalization: {target_sum: 10000, log_transform: true, method: lognorm}

phase10_confounders:
  cell_cycle_regression: true
  s_genes: tirosh2016
  g2m_genes: tirosh2016
  # The July run listed batch_key: batch, but that code ignored the key. This version uses it, and
  # stops at startup if obs has no 'batch' column. Set enabled: false to skip batch correction.
  batch_correction: {enabled: true, method: harmony, batch_key: batch, confounding_ari_threshold: 0.5, min_cells_per_batch: 50}
  imputation_prohibited: true
  fit_on_train_only: true

phase11_cell_line: {enabled: false}

phase12_metacell:
  enabled: true
  mbk_k: 2                          # perturbed cells -> MiniBatchKMeans k=2 metacells; controls stay single-cell
  seed: 42

plotting: {style: dark, dpi: 150, save_figures: true, figure_format: png}
output: {cleanup_intermediates: true, generate_report: true}
