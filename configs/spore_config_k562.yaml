# SPORE config: Replogle 2022 K562 genome-wide Perturb-seq (~2M cells). Cluster-scale.
# Settings follow the successful July 2026 HPC1 run (20 CPUs, 256 GB, ~1.5 h on a cpuq node).
#   python spore_cluster.py --config configs/spore_config_k562.yaml --print-sbatch > submit_spore.sh

paths:
  project_root: .                                                  # every relative path below resolves under this
  raw_h5ad: data/K562_gwps_raw_singlecell_01.h5ad                  # SET: the full raw K562 h5ad (Replogle 2022)
  processed_dir: spore_out_k562/processed                          # FRESH dirs for every run
  splits_dir:    spore_out_k562/splits
  figures_dir:   spore_out_k562/figures
  log_dir:       spore_out_k562/logs

dataset:
  name: K562_essential
  organism: human
  cell_type: K562
  perturbation_col: gene            # obs['gene'] holds target symbols
  control_label: non-targeting
  perturbation_type: CRISPRi
  gene_id_format: ensembl           # var_names are Ensembl; symbols are read from var['gene_name']

runtime:
  n_jobs: 20                        # spore_cluster.py overrides this with $SLURM_CPUS_PER_TASK
  sparse_on_load: true
  memory_monitor: true
  large_dataset_mode: auto
  large_dataset_threshold: 3000000  # keeps Phases 8 and 10 in-process (the July run); the worker path above this is untested
  checkpointing: true

phase0_ingestion: {chunk_size: 50000}
phase1_detection:
  enabled: true
  gene_id_harmonization: true
  modality_detection: false
  combinatorial_detection: false
  cell_line_detection: false

phase2_cell_triage:                 # ribo EXEMPTION for perturbation targets is in the fixed phase02 code
  mt_method: explicit_list
  mt_threshold: 0.2
  mt_genes: [MT-ND1, MT-ND2, MT-ND3, MT-ND4, MT-ND4L, MT-ND5, MT-ND6, MT-CO1, MT-CO2, MT-CO3, MT-ATP6, MT-ATP8, MT-CYB]
  ribo_prefixes: [RPL, RPS]
  min_genes_per_cell: 200
  max_genes_per_cell: 10000
  min_counts_per_cell: 500
  max_counts_per_cell: 80000

phase3_ambient: {enabled: false}
phase4_doublets: {enabled: false}
phase5_escaper_filtering:
  efficiency_threshold: 0.5
  escaper_percentile: 10
  min_cells_per_perturbation: 50
  direction: auto

phase6_gene_triage:
  min_cells_expressing: 10
  pct_filter: 0.01
  mean_umi_threshold: 0.25
  rescue_perturbation_targets: true
  rescue_combinatorial_constituents: false

phase7_splits:
  mode: zero_shot                   # gene-disjoint perturbation split; val/test perturbations never train the graph
  random_seed: 42
  stratify_bins: 4
  test_n: 960                       # ~20% / ~10% of the ~4,800 perturbations that survive triage
  val_n: 480

phase8_hvg:
  enabled: true
  n_top_genes: 5000
  method: seurat_v3
  rescue_perturbation_targets: true
  # v2.0 curated list (312 genes incl. the 227 Tahoe drug-screen targets). Held-out targets are added
  # automatically, so the July "complete_top4800" list is no longer needed.
  protected_gene_list: protected_genes/protected_genes_K562.json

phase9_normalization: {target_sum: 10000, log_transform: true, method: lognorm}

phase10_confounders:
  cell_cycle_regression: true
  s_genes: tirosh2016
  g2m_genes: tirosh2016
  batch_correction: {enabled: true, method: harmony, batch_key: gem_group, confounding_ari_threshold: 0.5, min_cells_per_batch: 50}
  imputation_prohibited: true
  fit_on_train_only: true

phase11_cell_line: {enabled: false}

phase12_metacell:
  enabled: true
  mbk_k: 2                          # perturbed cells -> MiniBatchKMeans k=2 metacells; controls stay single-cell
  seed: 42

subsetter: {n_perts: 250, max_cells_per_pert: 60, max_ctrl_cells: 3000, min_genes_per_cell: 200, chunk_size: 5000, seed: 42}
plotting: {style: dark, dpi: 150, save_figures: false, figure_format: png}
output: {cleanup_intermediates: true, generate_report: true}
