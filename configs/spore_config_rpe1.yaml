# SPORE example config: Replogle 2022 RPE1 essential-gene Perturb-seq screen.
# Copy this file, set the paths, and run:
#   python spore_local.py --config configs/spore_config_rpe1.yaml
# Point the four output dirs at FRESH directories for every new run.

paths:
  project_root: .                                      # every relative path below resolves under this
  raw_h5ad: data/rpe1_raw_singlecell_01.h5ad           # SET: the raw single-cell h5ad (counts, perturbation labels in .obs)
  processed_dir: spore_out_rpe1/processed
  splits_dir:    spore_out_rpe1/splits
  figures_dir:   spore_out_rpe1/figures
  log_dir:       spore_out_rpe1/logs

dataset:
  name: RPE1_essential
  organism: human
  cell_type: RPE1
  perturbation_col: gene
  control_label: non-targeting
  perturbation_type: CRISPRi
  gene_id_format: ensembl           # Replogle var = ensembl; var['gene_name'] holds the symbol (offline map)

runtime:
  n_jobs: 6
  sparse_on_load: true
  memory_monitor: true
  large_dataset_mode: auto
  large_dataset_threshold: 500000   # cells; RPE1 (~250k) stays in-process, larger datasets use worker subprocesses
  checkpointing: true

phase0_ingestion: {chunk_size: 50000}
phase1_detection:
  enabled: true
  gene_id_harmonization: true
  modality_detection: false
  combinatorial_detection: false
  cell_line_detection: false

phase2_cell_triage:
  mt_method: explicit_list
  mt_threshold: 0.2
  mt_genes: [MT-ND1, MT-ND2, MT-ND3, MT-ND4, MT-ND4L, MT-ND5, MT-ND6, MT-CO1, MT-CO2, MT-CO3, MT-ATP6, MT-ATP8, MT-CYB]
  ribo_prefixes: [RPL, RPS]
  min_genes_per_cell: 200
  max_genes_per_cell: 10000
  min_counts_per_cell: 500
  max_counts_per_cell: 80000

phase3_ambient: {enabled: false}
phase4_doublets: {enabled: false}
phase5_escaper_filtering:
  efficiency_threshold: 0.5
  escaper_percentile: 10
  min_cells_per_perturbation: 50
  direction: auto

phase6_gene_triage:
  min_cells_expressing: 10
  pct_filter: 0.01
  mean_umi_threshold: 0.25
  rescue_perturbation_targets: true
  rescue_combinatorial_constituents: false

phase7_splits:
  mode: zero_shot
  random_seed: 42
  stratify_bins: 4
  test_n: 306                       # ~20% test / ~10% val of surviving perts
  val_n: 153

phase8_hvg:
  enabled: true
  n_top_genes: 5000
  method: seurat_v3
  rescue_perturbation_targets: true
  protected_gene_list: protected_genes/protected_genes_RPE1.json   # curated regulators; held-out targets are protected automatically

phase9_normalization: {target_sum: 10000, log_transform: true, method: lognorm}

phase10_confounders:
  cell_cycle_regression: true
  s_genes: tirosh2016
  g2m_genes: tirosh2016
  # The batch column must exist in .obs; SPORE stops at startup if it does not.
  batch_correction: {enabled: true, method: harmony, batch_key: gem_group, confounding_ari_threshold: 0.5, min_cells_per_batch: 50}
  imputation_prohibited: true
  fit_on_train_only: true

phase11_cell_line: {enabled: false}

phase12_metacell:
  enabled: true
  mbk_k: 2                          # perturbed cells -> MiniBatchKMeans k=2 metacells; controls stay single-cell
  seed: 42

# Used only with --subset-first (datasets too large for workstation RAM).
subsetter:
  n_perts:            250    # keep the N perturbations with the most cells
  max_cells_per_pert:  60    # reservoir-sample this many cells per perturbation
  max_ctrl_cells:    3000    # max non-targeting control cells
  min_genes_per_cell:  200
  chunk_size:         5000
  seed:                 42

plotting: {style: dark, dpi: 150, save_figures: false, figure_format: png}
output: {cleanup_intermediates: false, generate_report: true}
